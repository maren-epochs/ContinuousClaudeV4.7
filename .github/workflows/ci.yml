# CI: pre-commit (ruff + privacy guard) and the full pytest run (unit + integration,
# incl. the .claude/hooks/test_*.sh suites) on Linux and Windows, Python 3.13.
# Dependencies come from requirements.lock (exact pins); plotly-resampler is installed
# with --no-deps because 0.11.1 declares plotly<7 (see pyproject.toml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash  # Git Bash on Windows
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps plotly-resampler==0.11.1

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: pre-commit
        # The privacy guard reads CCV_PRIVACY_TERMS (VAL-704). Without the secret
        # (e.g. fork PRs) it warns and still checks paths, username and session ids.
        env:
          CCV_PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: python -m pre_commit run --all-files --show-diff-on-failure

      - name: pytest (unit + integration)
        run: python -m pytest -q
