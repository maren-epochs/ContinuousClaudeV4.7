# pre-commit hooks. Setup: py -3.13 -m pip install pre-commit && py -3.13 -m pre_commit install
# Full tree: py -3.13 -m pre_commit run --all-files
# Ruff settings (rules, format excludes for **/*.md and continuum/**) live in pyproject.toml;
# force-exclude there makes them apply to the filenames pre-commit passes.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8  # keep in step with the installed ruff (ruff --version)
    hooks:
      - id: ruff-check  # lint only, no --fix
      - id: ruff-format
        args: [--check]  # report, never rewrite during commit
  # Reads the executable bit from git's index, so it catches on Windows what ruff
  # EXE001/EXE002 only reports on Linux (a shebang file not marked +x, or the reverse).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
  - repo: local
    hooks:
      - id: privacy-guard
        name: privacy guard (home paths, OS username, session ids, private terms)
        # language: python -> pre-commit runs it in its own venv, so `python` exists
        # on every OS (no `py` launcher needed); the guard is stdlib-only.
        entry: python tools/privacy_guard.py
        language: python
        types: [text]
