# pre-commit hooks. Setup: py -3.13 -m pip install pre-commit && py -3.13 -m pre_commit install
# Full tree: py -3.13 -m pre_commit run --all-files
# Ruff settings (rules, format excludes for **/*.md and continuum/**) live in pyproject.toml;
# force-exclude there makes them apply to the filenames pre-commit passes.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8  # keep in step with the installed ruff (ruff --version)
    hooks:
      - id: ruff-check  # lint only, no --fix
      - id: ruff-format
        args: [--check]  # report, never rewrite during commit
  - repo: local
    hooks:
      - id: privacy-guard
        name: privacy guard (home paths, OS username, session ids, private terms)
        entry: py -3.13 tools/privacy_guard.py
        language: system
        types: [text]
