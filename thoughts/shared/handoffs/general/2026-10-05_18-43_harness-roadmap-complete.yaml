# ── DECISIONS (capture WHY) ──────────────────────────────────────
decisions:
  - name: shim_autostart_off_by_default
    chose: tldr-shim must be started explicitly (or TLDR_READ_SHIM_AUTOSTART=1)
    over: [auto-spawn on first read]
    because: the mtime-invalidation test uses a >1s timing proxy that a live shim would break; fail-open semantics preserved
  - name: context_by_reference
    chose: PREPARE writes captures to continuum context/ dir, prompts carry paths
    over: [verbatim paste per worker (old doctrine)]
    because: measured 66KB->1.3KB for a 2-worker task; workers read what they need
  - name: run_python_bridge
    chose: host-CPython bridge function inside ouros sandbox
    over: [replacing ouros with plain Bash python, abandoning DS]
    because: ouros is a reimplemented interpreter (no site-packages, ever); the bridge keeps session persistence + token discipline while CPython does numerics; not a privilege escalation (agent already has Bash)
  - name: bloks_scoring_accepted_broken
    chose: document scoring as nonfunctional, corrections as superseding rule cards
    over: [forking parcadei/bloks (Rust) to fix ack/nack]
    because: upstream archived; fork cost unsized; context injection (the valuable half) works

