  read when entering each phase. PREPARE now writes captures ONCE to
  continuum/autonomous/{task}/context/ and worker prompts carry file PATHS, not
  verbatim pastes (98% prompt-payload reduction measured).
  tldr economics: the ~2s per analysis call is a per-directory daemon probe on a
  closed loopback port (parcadei/tldr-code#99), not init. tldr-read.mjs mitigates
  with an mtime+size output cache ('{}' never cached) + optional persistent shim
  (.claude/hooks/tldr-shim.mjs owns a tldr-mcp child; cold 2.2s->150ms;
  TLDR_READ_SHIM=0 disables, TLDR_READ_SHIM_AUTOSTART=1 opt-in). .ipynb reads get
  a pure-JS cell map, truncated before the first base64 line.
  DS: the ouros sandbox is a reimplemented Rust interpreter — pandas is impossible
  IN-sandbox. run_python(code) bridges to host py -3.13 (full DS stack installed:
  pandas 3.0.6/numpy/matplotlib/seaborn/scipy/pyarrow/polars/sklearn/statsmodels/
  duckdb/openpyxl), cwd pinned to C:\tmp\ouros-sandbox-output\{session}\, new files
  surfaced as 'artifacts:' lines. OUROS_DATA_ROOTS extends read access. --session
  loads by default now (--reset wipes). /analyze-data skill prescribes the loop.
  bloks: context injection works (40+ rule cards); ack/nack scoring is broken
  INSIDE bloks 0.1.0 and upstream parcadei/bloks is ARCHIVED — treat scoring as
  nonfunctional, corrections go in as superseding rule cards.

