# ── MENTAL MODEL (REQUIRED) ──────────────────────────────────────
mental_model: |
  Continuous Claude v4.7 lives in TWO places: the live global install in ~/.claude
  (skills/, agents/, hooks/, scripts/, tools/ — hooks registered in ~/.claude/settings.json
  with absolute `node "~/.claude/hooks/*.mjs"` commands) and the git
  clone at ~\Documents\ccv47-readme-fix.
  As of this session the clone's `origin` is the fork (maren-epochs/ContinuousClaudeV4.7)
  and `upstream` is parcadei/ContinuousClaudeV4.7. Fork main = upstream main (a500a2c, the
  only upstream commit) + seven fix branches merged --no-ff (one merge commit each, so each
  is droppable when its upstream PR lands) + two fork-only commits (cargo-PATH prepend in
  readiness scripts; install/sync_global.py + install/README.md).
  install/sync_global.py is the bridge: copies agents/hooks/skills/scripts/tools into
  ~/.claude, rewriting repo-relative paths in .md files to absolute ones and pinning
  `py -3.13` (ouros has wheels only through cp313; default python is 3.14). Dry run by
  default, --apply writes with backups to ~/.claude/.ccv47-backup/<timestamp>/ and records
  the commit in ~/.claude/.ccv47-installed. It NEVER touches settings.json, CLAUDE.md,
  .env, or *.orig — hook registration stays manual.
  Upstream repo is effectively unmaintained: issues #11-#15 and PRs #13-#20 all open, zero
  maintainer response since 2026-09-21; only CodeRabbit bot ever replied.
  Git line-ending trap in this repo: core.autocrlf=true, no .gitattributes, working tree is
  CRLF, blobs are LF. All live-vs-repo diffs must normalize with `tr -d '\r'`. Also MSYS
  bash mangles `origin/main:path` args — export MSYS2_ARG_CONV_EXCL='*' before git cat-file
  style commands.

