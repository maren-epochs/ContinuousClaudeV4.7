# ── DECISIONS (capture WHY) ──────────────────────────────────────
decisions:
  - name: fork_main_as_integration_branch
    chose: merge all fix branches into fork main with --no-ff merge commits
    over: [rebasing fixes into one linear branch, keeping branches separate and hand-patching ~/.claude]
    because: upstream is unresponsive; --no-ff keeps each fix revertable/droppable when its PR eventually merges upstream
    constraint: fix branches must stay untouched — they back open upstream PRs
  - name: installer_rewrites_at_copy_time
    chose: sync_global.py rewrites repo-relative paths to absolute during copy (.md files only)
    over: [committing absolute paths into the fork, symlinking ~/.claude dirs to the repo]
    because: fork stays upstream-mergeable and portable; the install-specific deltas (paths, py -3.13 pin) are machine-local concerns
  - name: installer_never_touches_config
    chose: settings.json, CLAUDE.md, .env, *.orig excluded from sync
    over: [full-directory sync]
    because: settings.json/CLAUDE.md hold user config predating the harness; repo ships a CLAUDE.md that would clobber user preferences
  - name: crlf_output
    chose: installer writes CRLF on Windows (--eol crlf default)
    over: [LF]
    because: matches what the original hand-install produced; keeps diffs against existing ~/.claude files clean

