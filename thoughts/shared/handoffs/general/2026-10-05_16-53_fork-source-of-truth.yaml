# ── APPROACHES ───────────────────────────────────────────────────
worked:
  - Temp git worktree at $TEMP/ccv47-merge to merge all fix branches and diff against live install without touching the main checkout
  - tr -d '\r' on both sides of every diff to neutralize the CRLF working tree
  - MSYS2_ARG_CONV_EXCL='*' to stop Git Bash path-mangling rev:path arguments

failed:
  - attempted: bash for-loop calling `git show origin/main:$f | diff - $live` without MSYS2_ARG_CONV_EXCL
    root_cause: MSYS path conversion rewrote 'origin/main:.claude/...' into 'origin\main;.claude\...' making git see an ambiguous revision
    avoid: any Git Bash command passing colon-containing rev:path args without the env guard
    use_instead: export MSYS2_ARG_CONV_EXCL='*' first, or use git cat-file -p
  - attempted: git worktree remove --force from Git Bash
    root_cause: Windows held a lock on a file inside the worktree (likely the shell's CWD)
    avoid: removing a worktree while any process has CWD inside it
    use_instead: cd out, Remove-Item -Recurse -Force from PowerShell, then git worktree prune

