# ── MENTAL MODEL (REQUIRED) ──────────────────────────────────────
mental_model: |
  Repo = public fork maren-epochs/ContinuousClaudeV4.7; ~/.claude is BUILT from it by
  `py -3.13 install/sync_global.py --apply` (copies the working tree: commit first). The live
  ~/.claude/tools/viz and skills are STALE until the user runs it (agent hands the command).
  tools/viz is consumed outside the repo as `ccv_viz`: the one-line PRELUDE (visualize SKILL.md,
  analyze-data step 5, demo.py line 1) walks cwd + parents, then ~/.claude, for
  tools/viz/palette.json, registers that dir as package `ccv_viz` via importlib, and raises
  ModuleNotFoundError naming sync_global when nothing is found. Reason: a user project's regular
  tools/__init__.py beats our namespace `tools` regardless of sys.path order. style.py and
  artifact_page.py import palette relatively (`from . import palette`) with a script-mode fallback,
  so CLIs (`py -3.13 tools/viz/<x>.py`) and in-repo `from tools.viz import` still work.
  palette: ordinal(mode) = bounded steps from palette.json ordinal_bounds (light 250..650 x5, dark
  100..600 x6; more levels repeat); gray(mode) = text-muted #898781 (reference names the role, no
  hex); emphasis highlight must be series-1 (aqua/magenta/dark red collapse vs gray under CVD).
  style.gt_style(GT, mode): set GT(id=...) BEFORE calling it. artifact_page end_labels: True |
  [names]; anything else warns on the page.
  continuum/research and thoughts/shared/handoffs are TRACKED + PUBLIC: no usernames, absolute
  user paths, other project names, session UUIDs. Write `~/...` and project-A/B labels.

