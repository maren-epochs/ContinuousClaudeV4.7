# ── MENTAL MODEL (REQUIRED) ──────────────────────────────────────
mental_model: |
  Every shell a Claude Code session spawns carries per-session env vars: CLAUDECODE=1,
  CLAUDE_CODE_CHILD_SESSION=1, CLAUDE_CODE_SESSION_ID, CLAUDE_PID, CLAUDE_EFFORT,
  CLAUDE_CODE_MESSAGING_SOCKET/TOKEN, CLAUDE_CODE_BRIDGE_SESSION_ID, ... A `claude` started with
  CLAUDE_CODE_CHILD_SESSION set takes itself for a child: it shows "Transcript saving is off -
  inherited CLAUDE_CODE_CHILD_SESSION marker", writes no transcript and does not register in
  ~/.claude/sessions, so fleet does not see it. Running `fleet open` from a session's Bash (the
  /fleet open path) passed that env through wt.exe to every tab; wt does forward the caller's env.
  Fix: launch.clean_env (tools/fleet/launch.py:177) drops CLAUDECODE, CLAUDE_PID, CLAUDE_EFFORT
  and every CLAUDE_CODE_* before Popen (launch.py:194). The user's own env lives in settings.json
  `env` (CLAUDE_AUTOCOMPACT_PCT_OVERRIDE, CLAUDE_CODE_MAX_OUTPUT_TOKENS, MAX_THINKING_TOKENS,
  TLDR_READ_SHIM_AUTOSTART) and is reapplied by claude itself; no CLAUDE* in the Windows user env.
  open --all (fleet.py:1021 open_sessions): interactive (stdin+stdout TTY, fleet._interactive at
  fleet.py:1017) -> prints the numbered list (candidates + extra picks appended) and input()s;
  launch.choose (launch.py:144) parses numbers, ranges 5-7, names, a/all; empty, EOF or Ctrl+C =
  cancel. Not interactive (Claude's Bash/`!`, scripts) -> lists and opens nothing. --yes = old
  open-everything. The /fleet skill always asks with AskUserQuestion boxes, never --all on its own.

