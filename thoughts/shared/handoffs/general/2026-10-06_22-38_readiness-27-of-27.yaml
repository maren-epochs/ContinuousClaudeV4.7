  terms read from untracked .git/info/privacy-terms + OS username + home paths + session UUIDs).
  Every commit runs it; it stashes unstaged changes, so do not commit while workers edit tracked files.
  tools/api_common.py = shared HTTP layer for exa_search/nia_docs; tools/_testing.py = shared test
