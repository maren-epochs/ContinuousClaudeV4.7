# ── MENTAL MODEL (REQUIRED) ──────────────────────────────────────
mental_model: |
  Fork maren-epochs/ContinuousClaudeV4.7 (this repo) is source of truth; ~/.claude is built by
  `py -3.13 install/sync_global.py --apply` (backups in ~/.claude/.ccv47-backup/). Sync copies the
  WORKING TREE - commit (or pause parallel agents) before --apply. For a single file, install via
  sync_global.render() (keeps path rewrites + CRLF) instead of a full sync.
  Hook registration is hand-maintained in ~/.claude/settings.json (absolute paths, per-extension
  `if` filters); install/settings.template.json mirrors it with relative paths. The repo has NO
  .claude/settings.json any more (fastedit-hook denied every Edit; removed).
  Hooks: status (statusLine; Claude Code used_percentage, handoffs via workspace.project_dir),
  tldr-read (+shim autostart; allow inside CLAUDE_PROJECT_DIR else "ask"), post-edit-diagnostics
  (ruff direct, E9/F63/F7/F82/invalid-syntax = error), pre-compact (auto-handoff to handoff root),
  auto-handoff-stop (pct file else transcript_path usage), worker-report-check (settings
  PostToolUse with if Edit(**/continuum/autonomous/*/reports/*.json) - reaches RUNNING workers,
  verified live; worker frontmatter Stop = late backstop only), session-start (registered
  matcher "compact" only - injects newest handoff after compaction).
  Handoff root everywhere: project thoughts/shared/handoffs/ if it exists, else
  ~/.claude/handoffs/<basename of launch dir>/.
  Verified Claude Code behaviors (this build): background subagents end at handback, so a
  SubagentStop block is recorded but does not resume them; worker FRONTMATTER PostToolUse never
  fires (3 probes) while SETTINGS-level PostToolUse does fire inside subagents; hook
  permissionDecision "allow" skips the prompt but deny/ask rules still apply (hooks docs).
  ouros sandbox: run_command tokenized, shell=False, argv-prefix allowlist, path-like args go
  through the read policy (secrets denylist incl. .env, keys, ~/.ssh, .claude.json, ADS
  .env:x), recursive grep/rg get secret exclusions, agent_call --max-turns 25. uv run / npm run
  still execute code by design - the denylist is a guard against mistakes, not a boundary.
  bloks = fork maren-epochs/bloks (~/Documents/bloks; CI green Win+Linux):
  scores in [-1,1], rules/tastes sorted by score, hidden below -0.5 (one nack hides).

