# ── MENTAL MODEL (REQUIRED) ──────────────────────────────────────
mental_model: |
  A clickable AskUserQuestion box suspends its session until clicked in that window; while it is open the
  session's Claude takes no tool rounds, so cross-session messages (SendMessage) queue unread. Verified live
  2026-10-08: 4 sessions (ripplemark, privacy, druckenmiller, myrtle) ignored 3 rounds of messages until the
  user cleared their boxes; then each drained EVERYTHING queued in order (relayed answers too -> ripplemark
  pushed d5e9f66). Fix = away mode: `fleet.py away on` creates ~/.claude/fleet/away; .claude/hooks/ask-queue.mjs
  (PreToolUse:AskUserQuestion) then denies the box, appends the questions to
  ~/.claude/fleet/questions/<session_id>.json (ids q-<8hex>) and its deny reason tells the model to list them
  A-D at the end of its reply, keep working, and record in-session answers with
  `py -3.13 ~/.claude/tools/fleet/fleet.py answer <id> "<text>"`. Away off (no flag) = hook is a no-op, boxes
  as usual (user chose this over always-queue because they want clickable boxes). /fleet questions opens
  clickable boxes whose question text starts `[fleet q-xxxxxxxx]`; the hook allows a call only when EVERY
  question carries that marker. `answer --via fleet` prints `relay to: <session name>`; the skill SendMessages
  it. First answer wins; a second is refused (exit 1). Dashboard shows a Pending questions card first.
  FLEET_QUESTIONS=0 disables the hook. Hook fails open (logs to ~/.claude/fleet/guard-errors.log).
  `fleet.py handoffs --since T`: landed = own transcript tail has a file_path tool input naming a new handoff;
  prior = an ended session's transcript in the same projects/<slug>/ folder wrote it (restart under new id);
  shared = no transcript; waiting otherwise.

