# ── MENTAL MODEL (REQUIRED) ──────────────────────────────────────
mental_model: |
  Harness sync status is file-level: collect.py loads install/sync_global.py from the manifest
  'repo' and runs target_plan/build_plan against ~/.claude; in_sync = plan has no new/update
  entries. Manifest sha256 is of RENDERED install output (rules + CRLF), so raw repo hashes never
  match - always compare via the sync plan. fleet.py report reads cached ~/.claude/fleet/state.json;
  after a sync it shows the old label until 'collect' (or report --fresh) runs.
  Redaction: tools/privacy_guard.py redact() and .claude/hooks/privacy-redact.mjs (JS port, byte
  parity tested) map home -> '~', username -> '<user>', terms -> '<private:HMAC8>' keyed by
  ~/.claude/privacy-key; restore() needs the local key and terms, so placeholders only restore on
  this machine. create-handoff runs the INSTALLED privacy_guard --redact; resume-handoff --restore.
  Statusline 'Q ask' counts other alive sessions with Session.extra.pending_ask. Machine memory
  alert lives in FleetState.machine_alerts (threshold 15% of total or FLEET_MEM_WARN_GB).
  The agent cannot git push (auto-mode classifier denies it); the user runs pushes and
  sync_global --apply via '!' commands.

