# Tool configuration only: this repo is not a built/installed package (no [build-system]).
[project]
name = "continuous-claude"
version = "4.7.0"
requires-python = ">=3.13"
# Ranges here, exact pins in requirements.lock (regenerate: py -3.13 tools/lock_requirements.py).
# tools/test_deps_lock.py keeps this file, the lock and tools/requirements-viz.txt consistent.
# Runtime: everything under tools/ and install/ is stdlib-only except the two web bridges
# (tools/exa_search.py, tools/nia_docs.py import aiohttp). Hooks are Node, not Python.
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
# tools/ouros_harness.py (/research, /autonomous-research). Wheels only up to cp313.
research = ["ouros>=0.0.7"]
# Visualization suite: same package set as tools/requirements-viz.txt (exact pins live
# there and in requirements.lock). Not listed: plotly-resampler 0.11.1 declares plotly<7,
# so no resolver can co-install it with plotly 7; install it with
# `py -3.13 -m pip install --no-deps plotly-resampler==0.11.1` (its deps are listed here).
viz = [
    "numpy>=2.5",
    "pandas>=3.0",
    "polars>=1.44",
    "duckdb>=1.5",
    "pyarrow>=25.0",
    "pillow>=12.3",
    "matplotlib>=3.11",
    "seaborn>=0.13.2",
    "altair[all]>=6.3",
    "vl-convert-python>=1.9,<2",    # 2.0 is still rc-only
    "vegafusion>=2.0",
    "plotly>=7.1",
    "kaleido>=1.4",
    "dash>=4.4",                    # plotly-resampler runtime dep
    "orjson>=3.12",                 # plotly-resampler runtime dep
    "tsdownsample>=0.1.5",          # plotly-resampler runtime dep
    "bokeh>=3.9,<3.10",             # panel 1.9.4 fails on import with bokeh 3.10.0
    "holoviews>=1.23",
    "hvplot>=0.12",
    "panel>=1.9.4",
    "great_tables[extra]>=1.0",
    "plotnine>=0.15",
    "lets-plot>=4.11",
    "scienceplots>=2.2",
    "adjustText>=1.4",
    "datashader>=0.19",
    "geopandas>=1.2",
    "pyogrio>=0.13",
    "shapely>=2.1",
    "pyproj>=3.8",
    "contextily>=1.7",
    "folium>=0.20",
    "pydeck>=0.9",
    "lonboard>=0.17",
    "mapclassify>=2.11",
    "colorcet>=3.2",
    "cmcrameri>=1.10",
    "colorspacious>=1.1",
    "qualpal>=1.1",
    "playwright>=1.63",
]
dev = [
    "pytest>=9.1",
    "coverage>=7.10",               # [tool.coverage.run] patch = ["subprocess"] needs 7.10+
    "mypy>=2.3",
    "ruff>=0.16.8,<0.17",           # rule set + formatter output change on minor releases
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py313"
# Vendored from the dataviz skill: never lint or reformat it here.
extend-exclude = ["tools/viz/validate_palette.py"]
# Honor the excludes for explicitly passed paths too (pre-commit, editor hooks).
force-exclude = true

[tool.ruff.lint]
# Rule set: ruff's own default selection (no `select`), i.e. exactly what a bare
# `ruff check .` ran before this file existed (ruff 0.16 default set).
# That set was NOT clean on 2026-10-06 (100 findings in 5 files). Implicit-Optional
# (RUF013) was fixed with the mypy pass; the rest is grandfathered per file below so
# new code gets the full set. Delete an entry when a refactor wave cleans that file.

[tool.ruff.lint.per-file-ignores]
# Tests assert on returncode themselves; class-level fixtures are read-only.
"**/test_*.py" = ["PLW1510", "RUF012"]
# Grandfathered (pre-existing, 2026-10-06): nested `async with` and one blind except.
"tools/nia_docs.py" = ["SIM117", "BLE001"]
"tools/exa_search.py" = ["SIM117"]
# Grandfathered (pre-existing): sandbox bridge; changes here get a hand-reviewed diff.
"tools/ouros_harness.py" = [
    "BLE001",
    "F401",
    "F541",
    "F841",
    "FURB188",
    "I001",
    "PLW1510",
    "S110",
]

[tool.ruff.format]
# ruff format defaults (black-compatible): double quotes, 88 columns, LF/CRLF preserved per file.
quote-style = "double"
line-ending = "auto"
# Not formatted: python blocks inside skill/docs markdown (the /visualize PRELUDE is a
# verbatim one-liner that tools/viz/test_import.py byte-compares) and research
# artifacts under continuum/ (demo.py opens with that same PRELUDE line).
exclude = ["**/*.md", "continuum/**"]

[tool.mypy]
# Strictness: mypy defaults (non-strict). Unannotated functions are not checked
# (check_untyped_defs off); annotated code is, including no-implicit-Optional.
# Third-party imports without stubs resolve to Any (ignore_missing_imports).
python_version = "3.13"
files = ["tools", "install"]
ignore_missing_imports = true
warn_unused_configs = true
exclude = [
    '(^|/)test_[^/]*\.py$',
    '^tools/viz/validate_palette\.py$',
]

[tool.pytest.ini_options]
testpaths = ["tools", "install", "tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = ["integration: end-to-end checks (hook suites, simulated install, CLIs); deselect with -m 'not integration'"]

[tool.coverage.run]
source = ["tools", "install"]
omit = ["*/test_*.py", "*/validate_palette.py"]
# Several suites drive the CLIs as child processes (context_ledger, validate_report,
# sync_global, ouros_harness); measure those too.
patch = ["subprocess"]

[tool.coverage.report]
omit = ["*/test_*.py", "*/validate_palette.py"]
show_missing = true
skip_empty = true
